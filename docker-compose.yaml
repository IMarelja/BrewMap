version: "3.8"

services:
  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubuntu2204
    container_name: brewmap-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: changeme
      MONGO_INITDB_DATABASE: brewmap
    ports:
     
      - "27019:27017" 
    volumes:
      - brewmap_data:/data/db
      - brewmap_config:/data/configdb
      - ./init-db:/docker-entrypoint-initdb.d:ro

volumes:
  brewmap_data:
    driver: local
  brewmap_config:
    driver: local