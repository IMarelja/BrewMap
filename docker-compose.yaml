version: "3.8"

services:
  mongodb:
    image: mongodb/mongodb-community-server:8.0-ubuntu2204
    container_name: brewmap-mongodb
    restart: unless-stopped
    environment:
      MONGODB_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGODB_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD:-changeme}
      MONGO_INITDB_DATABASE: brewmap
    ports:
     
      - "${MONGO_PORT:-27017}:27017"
    volumes:
      - brewmap_data:/data/db
      - brewmap_config:/data/configdb
      - ./init-db:/docker-entrypoint-initdb.d:ro

volumes:
  brewmap_data:
    driver: local
  brewmap_config:
    driver: local